<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Math — Numina</title>
<meta name="description" content="Five problems. The same five for everyone. Can you beat this result?">
<meta property="og:title" content="Numina · Today's Math">
<meta property="og:description" content="Five problems. The same five for everyone, everywhere.">
<meta property="og:image" content="https://numina.bytexio.com/img/og.jpg">
<meta name="theme-color" content="#070B16">
<link rel="icon" href="/img/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar"><a class="brand" href="/"><img src="/img/icon.png" alt="" width="30" height="30"> Numina</a></header>
<main class="challenge">
  <p class="meta" id="day">Today's Math</p>
  <h1 id="headline">Can you do these five?</h1>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <p class="lede" id="lede">A friend just played them. Every player gets the same five problems, so you can see who did it better.</p>
  <div class="actions">
    <a class="get" id="open" href="#">Open in Numina</a>
    <a class="ghost" id="store" href="https://testflight.apple.com/join/gk9ESn7c">Don't have it? Get Numina</a>
  </div>
  <p class="small-print">Free to play. No accounts, no ads, no tracking.</p>
</main>
<script>
  // Day number from ?d=, clamped to a positive integer — never echoed as HTML.
  var q = new URLSearchParams(location.search);
  var d = parseInt(q.get("d") || "", 10);
  var v = parseInt(q.get("v") || "1", 10) || 1;
  if (!isFinite(d) || d < 1 || d > 100000) d = null;
  if (d) document.getElementById("day").textContent = "Day " + d + " · Today's Math";
  // A friend's score to beat, kept only if it is one the app would accept.
  var whole = /^\d+$/;
  var c = q.get("c"), s = q.get("s");
  var mark = (whole.test(c) && whole.test(s) && +c <= 5 && +s >= 1 && +s <= 3600)
    ? "&c=" + +c + "&s=" + +s : "";
  var deep = "numina://daily" + (d ? "?day=" + d + "&v=" + v + mark : "");
  document.getElementById("open").setAttribute("href", deep);
  if (mark) {
    document.getElementById("headline").textContent = "Beat " + +c + "/5 in " + +s + "s.";
    document.getElementById("lede").textContent = "That's your friend's score. Same five problems. Your turn.";
  }
</script>
</body>
</html>
